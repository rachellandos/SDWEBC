<!DOCTYPE html>
<html>

<head>
    <title>Bootstrap Buttons Exercise</title>
    <!--INCLUDING BOOTSTRAP-->
    <link rel="stylesheet" href="../css/bootstrap.css">
</head>

<body>
    <section class="container mt-3 w-50 w-sm-25 w-md-50">
        <h1 class="text-bg-dark text-center">Bad News</h1>

        <div class="alert alert-warning" role="alert">
            You are going to die one day! It sucks, but it's normal :(
        </div>

        <button class="btn btn-success">Come To Terms With</button>
        <button class="btn btn-danger">Continue To Deny</button>

    </section>


    <!-- grid -->
    <section class="mt-5">
        <div class="container text-center">
            <div class="row">
                <div class="col-6 col-sm-6 col-md-4 bg-success">Column</div>
                <div class="col-6 col-sm-6 col-md-4 bg-secondary">Column</div>
                <div class="col-6 col-sm-6 col-md-4 bg-success">Column</div>
            </div>
        </div>
    </section>

    <section class="mt-5">
        <div class="container text-center">
            <div class="row">
                <div class="col-4 bg-danger">One third</div>
                <div class="col-8 bg-info">Two thirds</div>
                <div class="col-3 bg-warning">One Quarter</div>
                <div class="col-6 bg-primary">One Half</div>
                <div class="col-3 bg-warning">One Quarter</div>
            </div>
        </div>
    </section>
</body>

</html>
